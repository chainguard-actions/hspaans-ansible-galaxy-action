---
name: Test basic usage - Ansible Galaxy Role Importer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action runs with dummy API key (expect failure from Galaxy API)
        id: action
        uses: .
        with:
          api_key: dummy-api-key-for-testing
        continue-on-error: true

      - name: Assert action was invoked (outcome should be failure due to invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (either success or failure from Galaxy API)
          # but it must not be 'skipped' or empty (which would indicate it never ran)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome is empty, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
