---
name: Test basic usage with API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: testowner/testrole
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing

      - name: Assert action attempted Galaxy import and failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake API key is rejected by Ansible Galaxy
          # This confirms the action correctly attempted to call ansible-galaxy role import
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted Galaxy import and failed with fake credentials"
