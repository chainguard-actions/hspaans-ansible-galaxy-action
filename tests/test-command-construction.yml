---
name: Test command construction with repository context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrole
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: test-key-12345

      - name: Assert action ran and produced expected command output
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action installs ansible-core and attempts to run ansible-galaxy role import.
          # With a fake API key it will fail at the Galaxy API call, but the command
          # should have been constructed and echoed before the failure.
          # We verify the action ran (not skipped) and failed at the Galaxy call stage.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran and attempted Galaxy import as expected"
