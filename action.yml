author: 'hspaans'
name: 'Ansible Galaxy Role Importer'
description: 'Github Action for import your role into Ansible Galaxy.'
inputs:
  api_key:
    description: |
      Ansible Galaxy API Key
      Source: https://galaxy.ansible.com/me/preferences
    required: true
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: 'Install dependencies'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "ansible-core>=2.17.0,<2.18.0"
    - name: 'Install dependencies'
      shell: bash
      run: |
        args=(ansible-galaxy role import)
        if [ -n "$ACTION_API_KEY" ]
        then
          args+=(--api-key "$ACTION_API_KEY" "${GITHUB_REPOSITORY%/*}" "${GITHUB_REPOSITORY#*/}")
        fi
        echo "Command: ${args[*]}"
        "${args[@]}"
      env:
        ACTION_API_KEY: ${{ inputs.api_key }}
branding:
  icon: 'book'
  color: 'gray-dark'
